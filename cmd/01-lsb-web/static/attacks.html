<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSB 훼손 실험</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <nav class="nav" aria-label="페이지"><a href="/">1편 LSB</a><a href="/attacks.html" aria-current="page">훼손 실험</a><a href="/dct.html">DCT</a><a href="/strength.html">강도 비교</a><a href="/compare.html">한눈에 비교</a><a href="/recovery.html">훼손 후 복구</a></nav>
  <h1>LSB 훼손 실험</h1>
  <p class="muted">이미지에 JPEG 압축, 블러, 축소를 가했을 때 LSB 워터마크가 어떻게 망가지는지 봅니다. 이 실험에서는 메시지를 첫 행에만 넣지 않고, 불투명한 픽셀 전체에 반복해 나눠 넣습니다.</p>
  <form id="form">
    <input type="text" id="msg" value="https://dseung001.github.io/" spellcheck="false" autocomplete="off" aria-label="숨길 메시지">
    <button type="submit">실험 실행</button>
  </form>
  <div class="summary" id="summary"></div>
  <div id="view" hidden></div>
</main>
<script src="/attack-view.js"></script>
<script>
const view = createAttackView(document.getElementById("view"), "lsb");
const summary = document.getElementById("summary");

async function run() {
  summary.innerHTML = `<span class="loading">9개 조건 측정 중…</span>`;
  try {
    const d = await postAttack("lsb", document.getElementById("msg").value);
    view.render(d);
    document.getElementById("view").hidden = false;
    const ok = d.cases.filter((c) => c.match).length;
    summary.innerHTML = `9개 조건 중 <b>${ok}</b>개 완전 복원 · 무공격 기준 PSNR <b>${d.wmPsnr.toFixed(1)} dB</b>`;
  } catch (e) {
    summary.innerHTML = `<span class="err">${escHTML(e.message)}</span>`;
  }
}
document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); run(); });
run();
</script>
</body>
</html>
